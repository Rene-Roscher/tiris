[project]
name = "tiris"
version = "0.1.0"
description = "Local-first energy monitor for TP-Link Tapo smart plugs"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "psycopg[binary,pool]==3.3.9",
    "pydantic-settings==2.16.3",
    "tapo==0.13.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "httpx==0.28.1", "ruff==0.17.6"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiris"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters with Query()/Depends() defaults by design.
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends"]
