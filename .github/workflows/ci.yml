name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      db:
        image: timescale/timescaledb:2.24.0-pg18
        env:
          POSTGRES_USER: tiris
          POSTGRES_PASSWORD: tiris
          POSTGRES_DB: tiris_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tiris -d tiris_test" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --frozen
      - run: uv run ruff check tiris tests
      - run: uv run pytest -q
        env:
          TIRIS_TEST_DATABASE_URL: postgresql://tiris:tiris@127.0.0.1:5432/tiris_test

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json   # the version comes from its packageManager field
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types scripts/check-i18n.mjs
      - run: pnpm exec vue-tsc --noEmit
      - run: pnpm exec vite build

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/rene-roscher/tiris:ci   # the compose file's image name, so the smoke test runs this build
      - name: Smoke test in demo mode
        run: |
          docker compose -f docker-compose.demo.yml up -d --no-build
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/api/live >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS http://127.0.0.1:8080/ -o /dev/null
          docker compose -f docker-compose.demo.yml down -v
        env:
          COMPOSE_PROJECT_NAME: tiris-ci
          TIRIS_VERSION: ci
