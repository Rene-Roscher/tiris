# tiris: TimescaleDB + the app. The app uses the host network, because plug discovery sends UDP broadcasts
# into your LAN (port 20002), which do not leave a Docker bridge network.
name: tiris

services:
  db:
    image: timescale/timescaledb:2.24.0-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: tiris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tiris}
      POSTGRES_DB: tiris
    ports:
      - "127.0.0.1:${TIRIS_DB_PORT:-5433}:5432"
    volumes:
      - tiris-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiris -d tiris"]
      interval: 5s
      timeout: 3s
      retries: 30

  tiris:
    build: .
    image: tiris:local
    restart: unless-stopped
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      TIRIS_DATABASE_URL: postgresql://tiris:${POSTGRES_PASSWORD:-tiris}@127.0.0.1:${TIRIS_DB_PORT:-5433}/tiris

volumes:
  tiris-db:
